[defaults]
inventory = inventory.ini
host_key_checking = False
timeout = 60
gather_timeout = 300
forks = 25
retry_files_enabled = False
stdout_callback = yaml
bin_ansible_callbacks = True

[ssh_connection]
pipelining = True
retries = 3
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=60 -o ServerAliveCountMax=10
