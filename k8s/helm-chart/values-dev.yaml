# Development environment values
# Override these when deploying to dev

namespace: humor-game-dev

networkPolicy:
  enabled: true

backend:
  image:
    tag: latest
    repository: humor-game-backend
  imagePullPolicy: IfNotPresent
  replicaCount: 1
  port: 3001
  startupProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30

frontend:
  image:
    tag: latest
    repository: humor-game-frontend
  imagePullPolicy: IfNotPresent
  replicaCount: 1
  port: 80
  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /

postgres:
  image:
    tag: 15-alpine
    repository: postgres
  persistence:
    enabled: true
    size: 1Gi
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10

redis:
  image:
    tag: 7-alpine
    repository: redis
  livenessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10

configmap:
  data:
    NODE_ENV: "development"
    DB_NAME: "humor_memory_game"
    DB_USER: "gameuser"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
    API_PORT: "3001"
    CORS_ORIGIN: "http://localhost:3000,http://localhost:8080"
    FRONTEND_URL: "http://localhost:8080"
    API_BASE_URL: "/api"
