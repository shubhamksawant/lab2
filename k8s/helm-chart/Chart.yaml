apiVersion: v2
name: humor-game-helm-chart
description: Helm chart converted from kustomize base manifests. Now with Argo Rollouts Canary Deployment support
type: application
version: 0.2.0
appVersion: "1.1"
dependencies:
  - name: argo-rollouts
    version: "2.32.0"
    repository: "https://argoproj.github.io/argo-helm"
    alias: argo-rollouts
    condition: argoRollouts.enabled
