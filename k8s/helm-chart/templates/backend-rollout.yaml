{{- if .Values.backend.rolloutEnabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.backend.name }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    app: {{ .Values.backend.name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.backend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.backend.name }}
        version: {{ .Values.backend.image.tag | quote }}
      {{- if .Values.backend.annotations }}
      annotations:
{{ toYaml .Values.backend.annotations | indent 8 }}
      {{- end }}
    spec:
      containers:
        - name: {{ .Values.backend.name }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configmap.name }}
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configmap.name }}
                  key: API_PORT
            - name: DB_HOST
              value: "{{ .Values.postgres.name }}"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configmap.name }}
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configmap.name }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: DB_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configmap.name }}
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: JWT_SECRET
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configmap.name }}
                  key: CORS_ORIGIN
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configmap.name }}
                  key: FRONTEND_URL
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configmap.name }}
                  key: API_BASE_URL
          resources: {{ toYaml .Values.backend.resources | nindent 12 }}
          {{- if .Values.backend.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.backend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          {{- end }}

  {{- if .Values.backend.canary.enabled }}
  strategy:
    canary:
      # Initial traffic weight for canary
      canaryService: {{ .Values.backend.name }}-canary
      stableService: {{ .Values.backend.name }}-stable
      
      # Canary steps with progressive traffic increase
      steps:
      {{- range .Values.backend.canary.steps }}
      - weight: {{ .weight }}
        duration: {{ .duration }}
      {{- end }}
      
      # Traffic management (no special routing, default round-robin)
      # For advanced traffic splitting, use VirtualService with Istio
      
      # Optional: pause between steps
      pauseDuration: 5m

  {{- if .Values.backend.canary.analysis.enabled }}
      # Analysis configuration for each step
      analysis:
        templates:
        - name: backend-analysis
        startingStep: 1  # Start analysis from step 1 (after initial weight)
        interval: {{ .Values.backend.canary.analysis.interval }}
        threshold: {{ .Values.backend.canary.analysis.threshold }}
        successCriteria:
        - metricName: backend-error-rate
          successCriteria: "< {{ index .Values.backend.canary.analysis.metrics 0 \"threshold\" }}"
        {{- if gt (len .Values.backend.canary.analysis.metrics) 1 }}
        - metricName: backend-latency-p95
          successCriteria: "< {{ index .Values.backend.canary.analysis.metrics 1 \"threshold\" }}"
        {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
